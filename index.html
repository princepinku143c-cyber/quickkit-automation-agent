
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Next-generation AI automation workflow builder" />

    <!-- PWA / Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link
      rel="apple-touch-icon"
      href="https://cdn-icons-png.flaticon.com/512/9626/9626629.png"
    />
    <title>NexusStream - Live & Production Ready</title>

    <!-- Payments -->
    <script src="https://www.paypal.com/sdk/js?client-id=AYQc9F32Wvg2011l6gGrbwHCEC9WQjZvNfmZU5i9AupWYQAQE5Ejy06ji5yiYSyysBug1YJkM9oJ7m6v&currency=USD"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- Tailwind + Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="/manifest.json" />

    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Space Grotesk", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            colors: {
              nexus: {
                950: "#050505",
                900: "#0a0a0a",
                800: "#171717",
                700: "#262626",
                600: "#404040",
                500: "#525252",
                accent: "#00ff9d",
                wire: "#ffd700",
                success: "#00ff9d",
                warning: "#ffb800",
                danger: "#ff3333",
                port: "#3b82f6",
              },
            },
            animation: {
              'progress-indefinite': 'progress-indefinite 1.5s infinite linear',
            },
            keyframes: {
              'progress-indefinite': {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(300%)' },
              }
            }
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #050505;
        color: #e2e8f0;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        user-select: none;
      }
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #262626;
        border-radius: 2px;
      }
      .grid-pattern {
        background-color: #050505;
        background-image: radial-gradient(circle at 1px 1px, #1a1a1a 1px, transparent 0);
        background-size: 30px 30px;
      }
      .liquid-glass {
        background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@19.2.0",
    "react/jsx-runtime": "https://aistudiocdn.com/react@19.2.0/jsx-runtime",
    "react-dom/client": "https://aistudiocdn.com/react-dom@19.2.0/client",
    "firebase/app": "https://esm.sh/firebase@10.14.1/app",
    "firebase/auth": "https://esm.sh/firebase@10.14.1/auth",
    "firebase/firestore": "https://esm.sh/firebase@10.14.1/firestore",
    "@google/genai": "https://aistudiocdn.com/@google/genai@1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@0.555.0",
    "recharts": "https://aistudiocdn.com/recharts@3.5.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "firebase-functions": "https://esm.sh/firebase-functions@^7.0.3",
    "firebase-admin": "https://esm.sh/firebase-admin@^13.6.0",
    "axios": "https://esm.sh/axios@^1.13.3",
    "firebase-functions/": "https://esm.sh/firebase-functions@^7.0.3/"
  }
}
</script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Pointing directly to index.tsx at root -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
